<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RentDesk - Property & Tenant Management</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 400px;
      position: relative;
    }
    .lang-toggle {
      position: absolute;
      top: 15px;
      right: 15px;
      display: flex;
      gap: 5px;
    }
    .lang-btn {
      padding: 6px 12px;
      border: 2px solid #ddd;
      border-radius: 6px;
      background: white;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }
    .lang-btn.active {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }
    h1 {
      color: #333;
      text-align: center;
      margin-bottom: 10px;
      font-size: 28px;
    }
    .subtitle {
      color: #666;
      text-align: center;
      margin-bottom: 25px;
      font-size: 14px;
    }
    .form-group { margin-bottom: 15px; }
    label {
      display: block;
      margin-bottom: 6px;
      color: #333;
      font-weight: 500;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 14px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
    }
    .button-row {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-masuk {
      background: #667eea;
      color: white;
    }
    .btn-daftar {
      background: #10b981;
      color: white;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .message {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 14px;
      display: none;
    }
    .message.error {
      background: #fee;
      color: #c33;
      border: 1px solid #fcc;
      display: block;
    }
    .message.success {
      background: #efe;
      color: #3c3;
      border: 1px solid #cfc;
      display: block;
    }
    .dashboard { display: none; text-align: center; }
    .dashboard h2 { color: #333; margin-bottom: 15px; }
    .user-info {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      word-break: break-all;
    }
    .logout-btn {
      background: #e74c3c;
      color: white;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="lang-toggle">
      <button class="lang-btn active" id="btnEN" onclick="setLang('en')">EN</button>
      <button class="lang-btn" id="btnID" onclick="setLang('id')">ID</button>
    </div>
    
    <div id="authForm">
      <h1>🏠 RentDesk</h1>
      <p class="subtitle" id="subtitle">Property & Tenant Management</p>
      
      <div id="message" class="message"></div>
      
      <div class="form-group">
        <label for="email" id="labelEmail">Email</label>
        <input type="email" id="email" placeholder="name@email.com">
      </div>
      
      <div class="form-group">
        <label for="password" id="labelPassword">Password</label>
        <input type="password" id="password" placeholder="Minimum 6 characters">
      </div>
      
      <div class="button-row">
        <button class="btn btn-masuk" id="btnMasuk" onclick="handleLogin()">Sign In</button>
        <button class="btn btn-daftar" id="btnDaftar" onclick="handleDaftar()">Sign Up</button>
      </div>
    </div>
    
    <div id="dashboard" class="dashboard">
      <h2 id="dashTitle">✅ Login Successful!</h2>
      <div class="user-info">
        <strong id="dashEmailLabel">Your Email:</strong><br>
        <span id="userEmail"></span>
      </div>
      <p style="color: #666; margin-bottom: 20px;" id="dashWelcome">
        Welcome to RentDesk. Dashboard features coming soon!
      </p>
      <button class="logout-btn" id="btnLogout" onclick="handleLogout()">Sign Out</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script>
    const SUPABASE_URL = 'https://rtychlvtoirxsrakxdya.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_QZbMPa5m-FC53xD0De4O6A_nnm_WywL';
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    // ===== TRANSLATIONS =====
    const translations = {
      en: {
        subtitle: 'Property & Tenant Management',
        labelEmail: 'Email',
        labelPassword: 'Password',
        btnMasuk: 'Sign In',
        btnDaftar: 'Sign Up',
        dashTitle: '✅ Login Successful!',
        dashEmailLabel: 'Your Email:',
        dashWelcome: 'Welcome to RentDesk. Dashboard features coming soon!',
        btnLogout: 'Sign Out',
        processing: 'Processing...',
        signingUp: 'Signing up...',
        required: '❌ Email and password are required',
        minPass: '❌ Password must be at least 6 characters',
        signupSuccess: '✅ Account created! Please sign in.',
        logoutSuccess: 'You have been signed out.'
      },
      id: {
        subtitle: 'Pengelolaan Properti & Penyewa',
        labelEmail: 'Email',
        labelPassword: 'Kata Sandi',
        btnMasuk: 'Masuk',
        btnDaftar: 'Daftar',
        dashTitle: '✅ Berhasil Login!',
        dashEmailLabel: 'Email Anda:',
        dashWelcome: 'Selamat datang di RentDesk. Fitur dashboard segera hadir!',
        btnLogout: 'Keluar',
        processing: 'Memproses...',
        signingUp: 'Mendaftar...',
        required: '❌ Email dan kata sandi wajib diisi',
        minPass: '❌ Kata sandi minimal 6 karakter',
        signupSuccess: '✅ Akun berhasil dibuat! Silakan masuk.',
        logoutSuccess: 'Anda telah keluar.'
      }
    };
    
    let currentLang = 'en';
    
    function setLang(lang) {
      currentLang = lang;
      const t = translations[lang];
      
      document.getElementById('subtitle').textContent = t.subtitle;
      document.getElementById('labelEmail').textContent = t.labelEmail;
      document.getElementById('labelPassword').textContent = t.labelPassword;
      document.getElementById('btnMasuk').textContent = t.btnMasuk;
      document.getElementById('btnDaftar').textContent = t.btnDaftar;
      document.getElementById('dashTitle').textContent = t.dashTitle;
      document.getElementById('dashEmailLabel').textContent = t.dashEmailLabel;
      document.getElementById('dashWelcome').textContent = t.dashWelcome;
      document.getElementById('btnLogout').textContent = t.btnLogout;
      
      document.getElementById('btnEN').classList.toggle('active', lang === 'en');
      document.getElementById('btnID').classList.toggle('active', lang === 'id');
      
      // Update placeholder
      document.getElementById('password').placeholder = lang === 'en' ? 'Minimum 6 characters' : 'Minimal 6 karakter';
      document.getElementById('email').placeholder = lang === 'en' ? 'name@email.com' : 'nama@email.com';
    }
    
    async function checkSession() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) showDashboard(session.user.email);
    }
    
    function showMessage(text, type) {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.className = 'message ' + type;
    }
    
    function clearMessage() {
      document.getElementById('message').className = 'message';
    }
    
    async function handleLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btnMasuk');
      const t = translations[currentLang];
      
      if (!email || !password) {
        showMessage(t.required, 'error');
        return;
      }
      
      btn.disabled = true;
      btn.textContent = t.processing;
      clearMessage();
      
      try {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        showDashboard(data.user.email);
      } catch (error) {
        showMessage('❌ ' + error.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = t.btnMasuk;
      }
    }
    
    async function handleDaftar() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btnDaftar');
      const t = translations[currentLang];
      
      if (!email || !password) {
        showMessage(t.required, 'error');
        return;
      }
      if (password.length < 6) {
        showMessage(t.minPass, 'error');
        return;
      }
      
      btn.disabled = true;
      btn.textContent = t.signingUp;
      clearMessage();
      
      try {
        const { data, error } = await supabase.auth.signUp({ email, password });
        if (error) throw error;
        
        if (data.user && !data.session) {
          showMessage(t.signupSuccess, 'success');
        } else {
          showDashboard(data.user.email);
        }
      } catch (error) {
        showMessage('❌ ' + error.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = t.btnDaftar;
      }
    }
    
    async function handleLogout() {
      await supabase.auth.signOut();
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('authForm').style.display = 'block';
      document.getElementById('email').value = '';
      document.getElementById('password').value = '';
      clearMessage();
    }
    
    function showDashboard(email) {
      document.getElementById('authForm').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      document.getElementById('userEmail').textContent = email;
    }
    
    checkSession();
  </script>
</body>
</html>
