<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RentDesk - Property & Tenant Management</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 400px;
      position: relative;
    }
    .lang-toggle {
      position: absolute;
      top: 15px;
      right: 15px;
      display: flex;
      gap: 5px;
    }
    .lang-btn {
      padding: 6px 12px;
      border: 2px solid #ddd;
      border-radius: 6px;
      background: white;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }
    .lang-btn.active {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }
    h1 { color: #333; text-align: center; margin-bottom: 10px; font-size: 28px; }
    .subtitle { color: #666; text-align: center; margin-bottom: 25px; font-size: 14px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; color: #333; font-weight: 500; font-size: 14px; }
    input {
      width: 100%;
      padding: 14px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }
    input:focus { outline: none; border-color: #667eea; }
    .button-row { display: flex; gap: 10px; margin-top: 20px; }
    .btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:active { transform: scale(0.95); }
    .btn-masuk { background: #667eea; color: white; }
    .btn-daftar { background: #10b981; color: white; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .message { padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; display: none; }
    .message.error { background: #fee; color: #c33; border: 1px solid #fcc; display: block; }
    .message.success { background: #efe; color: #3c3; border: 1px solid #cfc; display: block; }
    .dashboard { display: none; text-align: center; }
    .dashboard h2 { color: #333; margin-bottom: 15px; }
    .user-info { background: #f5f5f5; padding: 15px; border-radius: 8px; margin-bottom: 15px; word-break: break-all; }
    .logout-btn {
      background: #e74c3c;
      color: white;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .status-bar {
      background: #d4edda;
      border: 1px solid #28a745;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 13px;
      color: #155724;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="lang-toggle">
      <button class="lang-btn active" id="btnEN">EN</button>
      <button class="lang-btn" id="btnID">ID</button>
    </div>

    <div id="authForm">
      <h1>🏠 RentDesk</h1>
      <p class="subtitle" id="subtitle">Property & Tenant Management</p>

      <div id="statusBar" class="status-bar">✅ Firebase connected</div>
      <div id="message" class="message"></div>

      <div class="form-group">
        <label for="email" id="labelEmail">Email</label>
        <input type="email" id="email" placeholder="name@email.com">
      </div>

      <div class="form-group">
        <label for="password" id="labelPassword">Password</label>
        <input type="password" id="password" placeholder="Minimum 6 characters">
      </div>

      <div class="button-row">
        <button class="btn btn-masuk" id="btnMasuk">Sign In</button>
        <button class="btn btn-daftar" id="btnDaftar">Sign Up</button>
      </div>
    </div>

    <div id="dashboard" class="dashboard">
      <h2 id="dashTitle">✅ Login Successful!</h2>
      <div class="user-info">
        <strong id="dashEmailLabel">Your Email:</strong><br>
        <span id="userEmail"></span>
      </div>
      <p style="color: #666; margin-bottom: 20px;" id="dashWelcome">
        Welcome to RentDesk. Dashboard features coming soon!
      </p>
      <button class="logout-btn" id="btnLogout">Sign Out</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAUnYXGF6n2G8-a4x3m3vDFOtkwGGTQa_0",
      authDomain: "rentdesk-manager.firebaseapp.com",
      projectId: "rentdesk-manager",
      storageBucket: "rentdesk-manager.firebasestorage.app",
      messagingSenderId: "216408702650",
      appId: "1:216408702650:web:75363154e03b95b36ccc83",
      measurementId: "G-NXJKHYD59V"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const translations = {
      en: {
        subtitle: 'Property & Tenant Management',
        labelEmail: 'Email', labelPassword: 'Password',
        btnMasuk: 'Sign In', btnDaftar: 'Sign Up',
        dashTitle: '✅ Login Successful!', dashEmailLabel: 'Your Email:',
        dashWelcome: 'Welcome to RentDesk. Dashboard features coming soon!',
        btnLogout: 'Sign Out', processing: 'Processing...', signingUp: 'Signing up...',
        required: '❌ Email and password are required',
        minPass: '❌ Password must be at least 6 characters',
        signupSuccess: '✅ Account created! Welcome!',
        dbReady: '✅ Firebase connected', dbError: '❌ Firebase failed to load'
      },
      id: {
        subtitle: 'Pengelolaan Properti & Penyewa',
        labelEmail: 'Email', labelPassword: 'Kata Sandi',
        btnMasuk: 'Masuk', btnDaftar: 'Daftar',
        dashTitle: '✅ Berhasil Login!', dashEmailLabel: 'Email Anda:',
        dashWelcome: 'Selamat datang di RentDesk. Fitur dashboard segera hadir!',
        btnLogout: 'Keluar', processing: 'Memproses...', signingUp: 'Mendaftar...',
        required: '❌ Email dan kata sandi wajib diisi',
        minPass: '❌ Kata sandi minimal 6 karakter',
        signupSuccess: '✅ Akun berhasil dibuat! Selamat datang!',
        dbReady: '✅ Firebase terhubung', dbError: '❌ Firebase gagal dimuat'
      }
    };

    let currentLang = 'en';
    const t = () => translations[currentLang];

    function setLang(lang) {
      currentLang = lang;
      const x = translations[lang];
      document.getElementById('subtitle').textContent = x.subtitle;
      document.getElementById('labelEmail').textContent = x.labelEmail;
      document.getElementById('labelPassword').textContent = x.labelPassword;
      document.getElementById('btnMasuk').textContent = x.btnMasuk;
      document.getElementById('btnDaftar').textContent = x.btnDaftar;
      document.getElementById('dashTitle').textContent = x.dashTitle;
      document.getElementById('dashEmailLabel').textContent = x.dashEmailLabel;
      document.getElementById('dashWelcome').textContent = x.dashWelcome;
      document.getElementById('btnLogout').textContent = x.btnLogout;
      document.getElementById('statusBar').textContent = x.dbReady;
      document.getElementById('btnEN').classList.toggle('active', lang === 'en');
      document.getElementById('btnID').classList.toggle('active', lang === 'id');
      document.getElementById('password').placeholder = lang === 'en' ? 'Minimum 6 characters' : 'Minimal 6 karakter';
      document.getElementById('email').placeholder = lang === 'en' ? 'name@email.com' : 'nama@email.com';
    }

    function showMessage(text, type) {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.className = 'message ' + type;
    }
    function clearMessage() {
      document.getElementById('message').className = 'message';
    }

    function showDashboard(email) {
      document.getElementById('authForm').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      document.getElementById('userEmail').textContent = email;
    }
    function showAuthForm() {
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('authForm').style.display = 'block';
      document.getElementById('email').value = '';
      document.getElementById('password').value = '';
      clearMessage();
    }

    async function handleLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btnMasuk');
      if (!email || !password) return showMessage(t().required, 'error');
      btn.disabled = true; btn.textContent = t().processing; clearMessage();
      try {
        const cred = await signInWithEmailAndPassword(auth, email, password);
        showDashboard(cred.user.email);
      } catch (e) {
        showMessage('❌ ' + e.message.replace('Firebase: ', '').replace(' (auth/', ' ').replace(').', ''), 'error');
      } finally {
        btn.disabled = false; btn.textContent = t().btnMasuk;
      }
    }

    async function handleDaftar() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btnDaftar');
      if (!email || !password) return showMessage(t().required, 'error');
      if (password.length < 6) return showMessage(t().minPass, 'error');
      btn.disabled = true; btn.textContent = t().signingUp; clearMessage();
      try {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        showMessage(t().signupSuccess, 'success');
        showDashboard(cred.user.email);
      } catch (e) {
        showMessage('❌ ' + e.message.replace('Firebase: ', '').replace(' (auth/', ' ').replace(').', ''), 'error');
      } finally {
        btn.disabled = false; btn.textContent = t().btnDaftar;
      }
    }

    document.getElementById('btnMasuk').addEventListener('click', handleLogin);
    document.getElementById('btnDaftar').addEventListener('click', handleDaftar);
    document.getElementById('btnLogout').addEventListener('click', async () => { await signOut(auth); showAuthForm(); });
    document.getElementById('btnEN').addEventListener('click', () => setLang('en'));
    document.getElementById('btnID').addEventListener('click', () => setLang('id'));

    onAuthStateChanged(auth, (user) => {
      if (user) showDashboard(user.email);
      else showAuthForm();
    });

    setLang('en');
  </script>
</body>
</html>
