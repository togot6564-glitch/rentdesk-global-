<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh; padding: 20px;
    }
    .card {
      background: white; padding: 30px; border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3); width: 100%;
      max-width: 400px; margin: 0 auto; position: relative;
    }
    .lang-toggle, .currency-toggle { display: flex; gap: 5px; }
    .lang-btn, .curr-btn {
      padding: 6px 12px; border: 2px solid #ddd; border-radius: 6px;
      background: white; cursor: pointer; font-size: 13px; font-weight: 600;
    }
    .lang-btn.active, .curr-btn.active { background: #667eea; color: white; border-color: #667eea; }
    .top-controls { position: absolute; top: 15px; right: 15px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    h1 { color: #333; text-align: center; margin-bottom: 8px; font-size: 26px; }
    .subtitle { color: #666; text-align: center; margin-bottom: 20px; font-size: 14px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; color: #333; font-weight: 500; font-size: 14px; }
    input, select, textarea {
      width: 100%; padding: 12px; border: 2px solid #ddd;
      border-radius: 8px; font-size: 16px; background: white; font-family: inherit;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #667eea; }
    textarea { min-height: 70px; resize: vertical; }
    .button-row { display: flex; gap: 10px; margin-top: 20px; }
    .btn {
      flex: 1; padding: 14px; border: none; border-radius: 8px;
      font-size: 16px; font-weight: 600; cursor: pointer;
    }
    .btn-primary { background: #667eea; color: white; }
    .btn-success { background: #10b981; color: white; }
    .btn-danger { background: #e74c3c; color: white; }
    .btn-ghost { background: #eee; color: #333; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .message { padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; display: none; }
    .message.error { background: #fee; color: #c33; border: 1px solid #fcc; display: block; }
    .message.success { background: #efe; color: #3c3; border: 1px solid #cfc; display: block; }
    #dashboard { display: none; max-width: 700px; margin: 0 auto; }
    .topbar {
      background: white; border-radius: 12px; padding: 15px 20px;
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      box-shadow: 0 5px 20px rgba(0,0,0,0.15); margin-bottom: 15px;
    }
    .topbar .brand { font-weight: 700; font-size: 18px; color: #333; }
    .topbar .who { font-size: 12px; color: #888; word-break: break-all; flex: 1; min-width: 140px; }
    .topbar-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .tab-bar { display: flex; gap: 8px; margin-bottom: 15px; }
    .tab-btn {
      flex: 1; padding: 12px 6px; border: 2px solid white; border-radius: 10px;
      background: rgba(255,255,255,0.3); color: white; font-weight: 700;
      font-size: 14px; cursor: pointer;
    }
    .tab-btn.active { background: white; color: #667eea; }
    .add-btn {
      background: #10b981; color: white; border: none; border-radius: 10px;
      padding: 14px 18px; font-size: 16px; font-weight: 700; cursor: pointer;
      width: 100%; margin-bottom: 15px; box-shadow: 0 5px 15px rgba(16,185,129,0.4);
    }
    .empty {
      background: rgba(255,255,255,0.9); border-radius: 12px; padding: 30px;
      text-align: center; color: #777; font-size: 15px;
    }
    .prop-card, .tenant-card, .rent-card {
      background: white; border-radius: 12px; padding: 18px;
      margin-bottom: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.12);
    }
    .prop-card h3, .tenant-card h3, .rent-card h3 { color: #333; font-size: 17px; margin-bottom: 6px; }
    .prop-card .addr, .tenant-card .info, .rent-card .info { color: #777; font-size: 14px; margin-bottom: 8px; }
    .prop-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .price { color: #667eea; font-weight: 700; font-size: 17px; }
    .price-usd { color: #10b981; font-weight: 700; font-size: 17px; }
    .badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; }
    .badge.available { background: #d1fae5; color: #065f46; }
    .badge.rented { background: #fee2e2; color: #991b1b; }
    .badge.inactive { background: #eee; color: #666; }
    .prop-actions, .tenant-actions, .rent-actions { display: flex; gap: 8px; margin-top: 12px; }
    .prop-actions .btn, .tenant-actions .btn, .rent-actions .btn { padding: 8px 14px; font-size: 14px; }
    .modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55);
      z-index: 100; align-items: flex-end; justify-content: center;
    }
    .modal.open { display: flex; }
    .modal-box {
      background: white; width: 100%; max-width: 480px;
      border-radius: 16px 16px 0 0; padding: 25px;
      max-height: 85vh; overflow-y: auto;
    }
    @media (min-width: 600px) {
      .modal { align-items: center; }
      .modal-box { border-radius: 16px; }
    }
    .modal-box h2 { color: #333; margin-bottom: 20px; font-size: 20px; }
    .forgot-link {
      display: block; text-align: right; font-size: 13px;
      color: #667eea; text-decoration: none; margin-top: 6px;
    }
    .contact-row { display: flex; gap: 8px; font-size: 13px; color: #555; margin-bottom: 4px; }
    .contact-row span { flex: 1; word-break: break-word; }
    .currency-label { font-size: 11px; color: #888; margin-top: 4px; text-align: right; }
    .input-currency-toggle { display: flex; gap: 5px; margin-top: 6px; }
    .input-currency-toggle .curr-btn { font-size: 12px; padding: 4px 10px; }
  </style>
</head>

      document.getElementById('btnID').classList.toggle('active', lang==='id');
      document.getElementById('btnEN2').classList.toggle('active', lang==='en');
      document.getElementById('btnID2').classList.toggle('active', lang==='id');
      document.getElementById('password').placeholder = lang==='en' ? 'Minimum 6 characters' : 'Minimal 6 karakter';
      document.getElementById('email').placeholder = lang==='en' ? 'name@email.com' : 'nama@email.com';
      document.getElementById('tNotes').placeholder = lang==='en' ? 'e.g. quiet person, pets allowed' : 'cth. suka tenang, boleh bawa hewan';
      renderAll();
    }

    function setDisplayCurrency(curr) {
      displayCurrency = curr;
      document.getElementById('btnUSD').classList.toggle('active', curr==='USD');
      document.getElementById('btnIDR').classList.toggle('active', curr==='IDR');
      renderAll();
    }

    function setInputCurrencyProp(curr) {
      inputCurrencyProp = curr;
      document.getElementById('pCurrUSD').classList.toggle('active', curr==='USD');
      document.getElementById('pCurrIDR').classList.toggle('active', curr==='IDR');
      document.getElementById('labelPPrice').textContent = t().labelPPrice.replace('USD', curr);
    }

    function setInputCurrencyRent(curr) {
      inputCurrencyRent = curr;
      document.getElementById('rCurrUSD').classList.toggle('active', curr==='USD');
      document.getElementById('rCurrIDR').classList.toggle('active', curr==='IDR');
      document.getElementById('labelRPrice').textContent = t().labelRPrice.replace('USD', curr);
    }

    function switchTab(tab) {
      document.getElementById('tabProp').classList.toggle('active', tab==='prop');
      document.getElementById('tabTen').classList.toggle('active', tab==='ten');
      document.getElementById('tabRent').classList.toggle('active', tab==='rent');
      document.getElementById('viewProp').style.display = tab==='prop' ? 'block' : 'none';
      document.getElementById('viewTen').style.display = tab==='ten' ? 'block' : 'none';
      document.getElementById('viewRent').style.display = tab==='rent' ? 'block' : 'none';
    }

    function showMessage(text, type, targetId='message') {
      const m = document.getElementById(targetId);
      if (m) { m.textContent = text; m.className = 'message ' + type; }
    }
    function clearMessage(targetId='message') {
      const m = document.getElementById(targetId);
      if (m) m.className = 'message';
    }

    async function handleLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btnMasuk');
      if (!email || !password) return showMessage(t().required, 'error');
      btn.disabled = true; btn.textContent = '...'; clearMessage();
      try { await signInWithEmailAndPassword(auth, email, password); }
      catch (e) { showMessage(t().loginError + e.message.replace('Firebase: ','').replace(/\s\(auth.*\)/,''), 'error'); }
      finally { btn.disabled = false; btn.textContent = t().btnMasuk; }
    }
    async function handleDaftar() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btnDaftar');
      if (!email || !password) return showMessage(t().required, 'error');
      if (password.length < 6) return showMessage(t().minPass, 'error');
      btn.disabled = true; btn.textContent = '...'; clearMessage();
      try { await createUserWithEmailAndPassword(auth, email, password); }
      catch (e) { showMessage(t().loginError + e.message.replace('Firebase: ','').replace(/\s\(auth.*\)/,''), 'error'); }
      finally { btn.disabled = false; btn.textContent = t().btnDaftar; }
    }
    async function handleReset() {
      const email = document.getElementById('email').value.trim();
      if (!email) return showMessage(t().resetNeedEmail, 'error');
      const btn = document.getElementById('btnLupa');
      const oldText = btn.textContent;
      btn.textContent = t().resetSending; btn.style.pointerEvents = 'none';
      try {
        await sendPasswordResetEmail(auth, email);
        showMessage(t().resetSent, 'success');
      } catch (e) {
        showMessage('❌ ' + e.message.replace('Firebase: ','').replace(/\s\(auth.*\)/,''), 'error');
      } finally { btn.textContent = oldText; btn.style.pointerEvents = 'auto'; }
    }

    function renderAll() {
      renderProps(currentProps);
      renderTenants(currentTenants);
      renderRentals(currentRentals);
    }

    function renderProps(list) {
      currentProps = list; const box = document.getElementById('propList');
      if (!list.length) { box.innerHTML = '<div class="empty">' + esc(t().emptyProp).replace(/\n/g,'<br>') + '</div>'; return; }
      box.innerHTML = list.map(p => {
        const name = get(p, 'nama', 'name');
        const address = get(p, 'alamat', 'address');
        const priceUSD = get(p, 'hargaUSD', 'priceUSD') || 0;
        const status = p.status || 'available';
        return `
        <div class="prop-card">
          <h3>${esc(name)}</h3>
          <div class="addr">📍 ${esc(address)}</div>
          <div class="prop-row">
            <div>
              <div class="price-usd">${fmtPrice(priceUSD)}</div>
              <div class="currency-label">${fmtEquiv(priceUSD)}</div>
            </div>
            <span class="badge ${status === 'rented' ? 'rented' : 'available'}">
              ${status === 'rented' ? t().rented : t().avail}
            </span>
          </div>
          <div class="prop-actions">
            <button class="btn btn-primary" onclick="window._editProp('${p.id}')">✏️</button>
            <button class="btn btn-danger" onclick="window._delProp('${p.id}')">🗑️</button>
          </div>
        </div>`;
      }).join('');
    }

    function renderTenants(list) {
      currentTenants = list; const box = document.getElementById('tenantList');
      if (!list.length) { box.innerHTML = '<div class="empty">' + esc(t().emptyTen).replace(/\n/g,'<br>') + '</div>'; return; }
      box.innerHTML = list.map(p => {
        const name = get(p, 'nama', 'name');
        const idNum = get(p, 'noKTP', 'idNumber');
        const phone = get(p, 'noHP', 'phone');
        const email = get(p, 'email', 'email');
        const notes = get(p, 'catatan', 'notes');
        return `
        <div class="tenant-card">
          <h3>👤 ${esc(name)}</h3>
          ${idNum ? `<div class="contact-row"><span>${t().idNum}: ${esc(idNum)}</span></div>` : ''}
          ${phone ? `<div class="contact-row"><span>${t().phone}: ${esc(phone)}</span></div>` : ''}
          ${email ? `<div class="contact-row"><span>${t().email}: ${esc(email)}</span></div>` : ''}
          ${notes ? `<div class="contact-row"><span>${t().notes}: ${esc(notes)}</span></div>` : ''}
          <div class="tenant-actions">
            <button class="btn btn-primary" onclick="window._editTen('${p.id}')">✏️</button>
            <button class="btn btn-danger" onclick="window._delTen('${p.id}')">🗑️</button>
          </div>
        </div>`;
      }).join('');
    }

    function renderRentals(list) {
      currentRentals = list; const box = document.getElementById('rentList');
      if (!list.length) { box.innerHTML = '<div class="empty">' + esc(t().emptyRent).replace(/\n/g,'<br>') + '</div>'; return; }
      box.innerHTML = list.map(r => {
        const tenantName = get(r, 'namaPenyewa', 'tenantName');
        const propName = get(r, 'namaProperti', 'propertyName');
        const start = get(r, 'mulai', 'start');
        const end = get(r, 'selesai', 'end');
        const priceUSD = get(r, 'hargaUSD', 'priceUSD') || 0;
        const status = r.status || 'active';
        return `
        <div class="rent-card">
          <h3>👤 ${esc(tenantName)} → 🏠 ${esc(propName)}</h3>
          <div class="info">${t().period}: ${esc(start)} s/d ${esc(end)}</div>
          <div class="prop-row">
            <div>
              <div class="price-usd">${fmtPrice(priceUSD)}</div>
              <div class="currency-label">${fmtEquiv(priceUSD)}</div>
            </div>
            <span class="badge ${status === 'active' ? 'available' : 'inactive'}">
              ${status === 'active' ? t().active : t().inactive}
            </span>
          </div>
          <div class="rent-actions">
            <button class="btn btn-primary" onclick="window._editRent('${r.id}')">✏️</button>
            <button class="btn btn-danger" onclick="window._delRent('${r.id}')">🗑️</button>
          </div>
        </div>`;
      }).join('');
    }

    window._editProp = id => {
      const p = currentProps.find(x => x.id === id); if (!p) return;
      editingPropId = id; document.getElementById('modalTitleProp').textContent = t().modalEditProp;
      document.getElementById('pName').value = get(p, 'nama', 'name');
      document.getElementById('pAddr').value = get(p, 'alamat', 'address');
      const priceUSD = get(p, 'hargaUSD', 'priceUSD') || 0;
      document.getElementById('pPrice').value = priceUSD;
      setInputCurrencyProp('USD');
      document.getElementById('pStatus').value = p.status || 'available';
      openModal('modalProp');
    };
    window._delProp = async id => { if (!confirm(t().delConfirm)) return; await deleteDoc(doc(db, 'properties', id)); };

    window._editTen = id => {
      const p = currentTenants.find(x => x.id === id); if (!p) return;
      editingTenId = id; document.getElementById('modalTitleTen').textContent = t().modalEditTen;
      document.getElementById('tName').value = get(p, 'nama', 'name');
      document.getElementById('tId').value = get(p, 'noKTP', 'idNumber');
      document.getElementById('tPhone').value = get(p, 'noHP', 'phone');
      document.getElementById('tEmail').value = get(p, 'email', 'email') || '';
      document.getElementById('tNotes').value = get(p, 'catatan', 'notes') || '';
      openModal('modalTen');
    };
    window._delTen = async id => { if (!confirm(t().delConfirm)) return; await deleteDoc(doc(db, 'tenants', id)); };

    function populateRentSelects() {
      const ts = document.getElementById('rTenant');
      const ps = document.getElementById('rProperty');
      ts.innerHTML = currentTenants.map(p => `<option value="${p.id}">${esc(get(p,'nama','name'))}</option>`).join('');
      ps.innerHTML = currentProps.map(p => {
        const priceUSD = get(p, 'hargaUSD', 'priceUSD') || 0;
        return `<option value="${p.id}" data-price="${priceUSD}">${esc(get(p,'nama','name'))} — ${fmtPrice(priceUSD)}</option>`;
      }).join('');
    }

    window._editRent = id => {
      const r = currentRentals.find(x => x.id === id); if (!r) return;
      populateRentSelects();
      editingRentId = id;
      document.getElementById('modalTitleRent').textContent = t().modalEditRent;
      document.getElementById('rTenant').value = get(r, 'penyewaId', 'tenantId');
      document.getElementById('rProperty').value = get(r, 'propertiId', 'propertyId');
      document.getElementById('rStart').value = get(r, 'mulai', 'start');
      document.getElementById('rEnd').value = get(r, 'selesai', 'end');
      const priceUSD = get(r, 'hargaUSD', 'priceUSD') || 0;
      document.getElementById('rPrice').value = priceUSD;
      setInputCurrencyRent('USD');
      document.getElementById('rStatus').value = r.status || 'active';
      openModal('modalRent');
    };
    window._delRent = async id => { if (!confirm(t().delConfirm)) return; await deleteDoc(doc(db, 'rentals', id)); };

    function openModal(id) { document.getElementById(id).classList.add('open'); }
    function closeModal(id) {
      document.getElementById(id).classList.remove('open');
      const msgId = id==='modalProp'?'modalMsgProp':id==='modalTen'?'modalMsgTen':'modalMsgRent';
      document.getElementById(msgId).className = 'message';
      if (id==='modalProp') editingPropId = null;
      else if (id==='modalTen') editingTenId = null;
      else editingRentId = null;
    }

    async function saveProperty() {
      const name = document.getElementById('pName').value.trim();
      const address = document.getElementById('pAddr').value.trim();
      const priceInput = Number(document.getElementById('pPrice').value);
      const status = document.getElementById('pStatus').value;
      const mm = document.getElementById('modalMsgProp');
      if (!name || !address || !priceInput) { mm.textContent = t().fillProp; mm.className = 'message error'; return; }
      const btn = document.getElementById('btnSaveProp'); btn.disabled = true;
      try {
        const priceUSD = toUSD(priceInput, inputCurrencyProp);
        const data = {
          nama: name, name: name, alamat: address, address: address,
          hargaUSD: priceUSD, priceUSD: priceUSD,
          status: status,
          'ID pemilik': currentUser.uid, ownerId: currentUser.uid,
          dibuatPada: Date.now(), createdAt: Date.now()
        };
        if (editingPropId) await updateDoc(doc(db, 'properties', editingPropId), data);
        else await addDoc(collection(db, 'properties'), data);
        closeModal('modalProp');
      } catch (e) { mm.textContent = '❌ ' + e.message; mm.className = 'message error'; }
      finally { btn.disabled = false; }
    }

    async function saveTenant() {
      const name = document.getElementById('tName').value.trim();
      const idNum = document.getElementById('tId').value.trim();
      const phone = document.getElementById('tPhone').value.trim();
      const email = document.getElementById('tEmail').value.trim();
      const notes = document.getElementById('tNotes').value.trim();
      const mm = document.getElementById('modalMsgTen');
      if (!name || !phone) { mm.textContent = t().fillTen; mm.className = 'message error'; return; }
      const btn = document.getElementById('btnSaveTen'); btn.disabled = true;
      try {
        const data = {
          nama: name, name: name,
          noKTP: idNum, idNumber: idNum,
          noHP: phone, phone: phone,
          email: email, email: email,
          catatan: notes, notes: notes,
          'ID pemilik': currentUser.uid, ownerId: currentUser.uid,
          dibuatPada: Date.now(), createdAt: Date.now()
        };
        if (editingTenId) await updateDoc(doc(db, 'tenants', editingTenId), data);
        else await addDoc(collection(db, 'tenants'), data);
        closeModal('modalTen');
      } catch (e) { mm.textContent = '❌ ' + e.message; mm.className = 'message error'; }
      finally { btn.disabled = false; }
    }

    async function saveRental() {
      const tenantId = document.getElementById('rTenant').value;
      const propertyId = document.getElementById('rProperty').value;
      const start = document.getElementById('rStart').value;
      const end = document.getElementById('rEnd').value;
      const priceInput = Number(document.getElementById('rPrice').value);
      const status = document.getElementById('rStatus').value;
      const mm = document.getElementById('modalMsgRent');
      if (!tenantId || !propertyId || !start || !end || !priceInput) { mm.textContent = t().fillRent; mm.className = 'message error'; return; }
      const tenant = currentTenants.find(x => x.id === tenantId);
      const prop = currentProps.find(x => x.id === propertyId);
      if (!tenant || !prop) { mm.textContent = t().needTenProp; mm.className = 'message error'; return; }
      const btn = document.getElementById('btnSaveRent'); btn.disabled = true;
      try {
        const priceUSD = toUSD(priceInput, inputCurrencyRent);
        const data = {
          tenantId: tenantId, penyewaId: tenantId,
          tenantName: get(tenant,'nama','name'), namaPenyewa: get(tenant,'nama','name'),
          propertyId: propertyId, propertiId: propertyId,
          propertyName: get(prop,'nama','name'), namaProperti: get(prop,'nama','name'),
          start: start, mulai: start,
          end: end, selesai: end,
          hargaUSD: priceUSD, priceUSD: priceUSD,
          status: status,
          ownerId: currentUser.uid, 'ID pemilik': currentUser.uid,
          createdAt: Date.now(), dibuatPada: Date.now()
        };
        if (editingRentId) await updateDoc(doc(db, 'rentals', editingRentId), data);
        else await addDoc(collection(db, 'rentals'), data);
        if (status === 'active') {
          try { await updateDoc(doc(db, 'properties', propertyId), { status: 'rented' }); } catch(e) {}
        }
        closeModal('modalRent');
      } catch (e) { mm.textContent = '❌ ' + e.message; mm.className = 'message error'; }
      finally { btn.disabled = false; }
    }

    function startListening() {
      if (unsubProp) unsubProp();
      if (unsubTen) unsubTen();
      if (unsubRent) unsubRent();

      const listen = (colName, setter) => {
        const q = query(collection(db, colName), where('ownerId', '==', currentUser.uid));
        return onSnapshot(q, snap => {
          if (snap.empty) {
            const q2 = query(collection(db, colName), where('ID pemilik', '==', currentUser.uid));
            return onSnapshot(q2, snap2 => {
              const list = snap2.docs.map(d => ({ id: d.id, ...d.data() }));
              list.sort((a, b) => (b.dibuatPada || b.createdAt || 0) - (a.dibuatPada || a.createdAt || 0));
              setter(list);
            });
          }
          const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          list.sort((a, b) => (b.dibuatPada || b.createdAt || 0) - (a.dibuatPada || a.createdAt || 0));
          setter(list);
        }, err => {
          const q2 = query(collection(db, colName), where('ID pemilik', '==', currentUser.uid));
          return onSnapshot(q2, snap2 => {
            const list = snap2.docs.map(d => ({ id: d.id, ...d.data() }));
            list.sort((a, b) => (b.dibuatPada || b.createdAt || 0) - (a.dibuatPada || a.createdAt || 0));
            setter(list);
          });
        });
      };

      unsubProp = listen('properties', renderProps);
      unsubTen = listen('tenants', renderTenants);
      unsubRent = listen('rentals', renderRentals);
    }

    onAuthStateChanged(auth, user => {
      currentUser = user;
      if (user) {
        document.getElementById('authForm').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        document.getElementById('dashEmail').textContent = user.email;
        startListening();
      } else {
        document.getElementById('dashboard').style.display = 'none';
        document.getElementById('authForm').style.display = 'block';
        if (unsubProp) { unsubProp(); unsubProp = null; }
        if (unsubTen) { unsubTen(); unsubTen = null; }
        if (unsubRent) { unsubRent(); unsubRent = null; }
        currentProps = []; currentTenants = []; currentRentals = [];
        clearMessage();
      }
    });

    document.getElementById('btnMasuk').addEventListener('click', handleLogin);
    document.getElementById('btnDaftar').addEventListener('click', handleDaftar);
    document.getElementById('btnLupa').addEventListener('click', (e) => { e.preventDefault(); handleReset(); });
    document.getElementById('btnLogout').addEventListener('click', () => signOut(auth));
    document.getElementById('tabProp').addEventListener('click', () => switchTab('prop'));
    document.getElementById('tabTen').addEventListener('click', () => switchTab('ten'));
    document.getElementById('tabRent').addEventListener('click', () => switchTab('rent'));

    document.getElementById('btnAddProp').addEventListener('click', () => {
      document.getElementById('modalTitleProp').textContent = t().modalAddProp;
      document.getElementById('pName').value = ''; document.getElementById('pAddr').value = '';
      document.getElementById('pPrice').value = '';
      setInputCurrencyProp('USD');
      document.getElementById('pStatus').value = 'available';
      openModal('modalProp');
    });
    document.getElementById('btnCancelProp').addEventListener('click', () => closeModal('modalProp'));
    document.getElementById('btnSaveProp').addEventListener('click', saveProperty);

    document.getElementById('btnAddTen').addEventListener('click', () => {
      document.getElementById('modalTitleTen').textContent = t().modalAddTen;
      document.getElementById('tName').value = ''; document.getElementById('tId').value = '';
      document.getElementById('tPhone').value = ''; document.getElementById('tEmail').value = '';
      document.getElementById('tNotes').value = '';
      openModal('modalTen');
    });
    document.getElementById('btnCancelTen').addEventListener('click', () => closeModal('modalTen'));
    document.getElementById('btnSaveTen').addEventListener('click', saveTenant);

    document.getElementById('btnAddRent').addEventListener('click', () => {
      if (!currentTenants.length || !currentProps.length) {
        showMessage(t().needTenProp, 'error');
        switchTab(currentProps.length ? 'ten' : 'prop');
        return;
      }
      populateRentSelects();
      document.getElementById('modalTitleRent').textContent = t().modalAddRent;
      document.getElementById('rStart').value = ''; document.getElementById('rEnd').value = '';
      document.getElementById('rPrice').value = '';
      setInputCurrencyRent('USD');
      document.getElementById('rStatus').value = 'active';
      const firstProp = currentProps[0];
      if (firstProp) {
        const priceUSD = get(firstProp, 'hargaUSD', 'priceUSD') || 0;
        document.getElementById('rPrice').value = priceUSD;
      }
      openModal('modalRent');
    });
    document.getElementById('rProperty').addEventListener('change', () => {
      const prop = currentProps.find(x => x.id === document.getElementById('rProperty').value);
      if (prop) {
        const priceUSD = get(prop, 'hargaUSD', 'priceUSD') || 0;
        document.getElementById('rPrice').value = priceUSD;
      }
    });
    document.getElementById('btnCancelRent').addEventListener('click', () => closeModal('modalRent'));
    document.getElementById('btnSaveRent').addEventListener('click', saveRental);

    document.getElementById('btnEN').addEventListener('click', () => setLang('en'));
    document.getElementById('btnID').addEventListener('click', () => setLang('id'));
    document.getElementById('btnEN2').addEventListener('click', () => setLang('en'));
    document.getElementById('btnID2').addEventListener('click', () => setLang('id'));
    document.getElementById('btnUSD').addEventListener('click', () => setDisplayCurrency('USD'));
    document.getElementById('btnIDR').addEventListener('click', () => setDisplayCurrency('IDR'));
    document.getElementById('pCurrUSD').addEventListener('click', () => setInputCurrencyProp('USD'));
    document.getElementById('pCurrIDR').addEventListener('click', () => setInputCurrencyProp('IDR'));
    document.getElementById('rCurrUSD').addEventListener('click', () => setInputCurrencyRent('USD'));
    document.getElementById('rCurrIDR').addEventListener('click', () => setInputCurrencyRent('IDR'));

    setLang('en');
  </script>
</body>
</html>
