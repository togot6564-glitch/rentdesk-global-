<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RentDesk - Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 400px;
    }
    h1 {
      color: #333;
      text-align: center;
      margin-bottom: 10px;
    }
    .subtitle {
      color: #666;
      text-align: center;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .form-group { margin-bottom: 20px; }
    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      transition: border 0.3s;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover { background: #5568d3; }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .message {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }
    .message.error {
      background: #fee;
      color: #c33;
      border: 1px solid #fcc;
      display: block;
    }
    .message.success {
      background: #efe;
      color: #3c3;
      border: 1px solid #cfc;
      display: block;
    }
    .switch-mode {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #666;
    }
    .switch-mode a {
      color: #667eea;
      cursor: pointer;
      text-decoration: none;
    }
    .switch-mode a:hover { text-decoration: underline; }
    .dashboard {
      display: none;
      text-align: center;
    }
    .dashboard h2 { color: #333; margin-bottom: 20px; }
    .user-info {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      word-break: break-all;
    }
    .logout-btn {
      background: #e74c3c;
    }
    .logout-btn:hover { background: #c0392b; }
  </style>
</head>
<body>
  <div class="container">
    <!-- FORM LOGIN/DAFTAR -->
    <div id="authForm">
      <h1>🏠 RentDesk</h1>
      <p class="subtitle">Pengelolaan Properti & Penyewa</p>
      
      <div id="message" class="message"></div>
      
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="nama@email.com">
      </div>
      
      <div class="form-group">
        <label for="password">Kata Sandi</label>
        <input type="password" id="password" placeholder="Minimal 6 karakter">
      </div>
      
      <button id="submitBtn" onclick="handleAuth()">Masuk</button>
      
      <div class="switch-mode">
        <span id="switchText">Belum punya akun?</span>
        <a onclick="toggleMode()" id="switchLink">Daftar di sini</a>
      </div>
    </div>
    
    <!-- DASHBOARD SETELAH LOGIN -->
    <div id="dashboard" class="dashboard">
      <h2>✅ Berhasil Login!</h2>
      <div class="user-info">
        <strong>Email Anda:</strong><br>
        <span id="userEmail"></span>
      </div>
      <p style="color: #666; margin-bottom: 20px;">
        Selamat datang di RentDesk. Fitur dashboard akan segera ditambahkan!
      </p>
      <button class="logout-btn" onclick="handleLogout()">Keluar</button>
    </div>
  </div>

  <!-- SUPABASE VIA CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script>
    // ===== KONFIGURASI SUPABASE =====
    const SUPABASE_URL = 'https://rtychlvtoirxsrakxdya.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_QZbMPa5m-FC53xD0De4O6A_nnm_WywL';
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    let isLoginMode = true;
    
    // ===== CEK STATUS LOGIN SAAT HALAMAN DIBUKA =====
    async function checkSession() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        showDashboard(session.user.email);
      }
    }
    
    // ===== HANDLE LOGIN / DAFTAR =====
    async function handleAuth() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('message');
      
      // Validasi
      if (!email || !password) {
        showMessage('Email dan kata sandi wajib diisi', 'error');
        return;
      }
      if (password.length < 6) {
        showMessage('Kata sandi minimal 6 karakter', 'error');
        return;
      }
      
      btn.disabled = true;
      btn.textContent = isLoginMode ? 'Memproses...' : 'Mendaftarkan...';
      msg.className = 'message';
      
      try {
        if (isLoginMode) {
          // MODE LOGIN
          const { data, error } = await supabase.auth.signInWithPassword({
            email, password
          });
          if (error) throw error;
          showDashboard(data.user.email);
          showMessage('Login berhasil!', 'success');
        } else {
          // MODE DAFTAR
          const { data, error } = await supabase.auth.signUp({
            email, password
          });
          if (error) throw error;
          showMessage('✅ Akun berhasil dibuat! Silakan cek email untuk verifikasi, lalu login.', 'success');
          setTimeout(() => toggleMode(), 2000);
        }
      } catch (error) {
        showMessage('❌ ' + error.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = isLoginMode ? 'Masuk' : 'Daftar';
      }
    }
    
    // ===== LOGOUT =====
    async function handleLogout() {
      await supabase.auth.signOut();
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('authForm').style.display = 'block';
      document.getElementById('email').value = '';
      document.getElementById('password').value = '';
    }
    
    // ===== TOGGLE LOGIN / DAFTAR =====
    function toggleMode() {
      isLoginMode = !isLoginMode;
      const btn = document.getElementById('submitBtn');
      const switchText = document.getElementById('switchText');
      const switchLink = document.getElementById('switchLink');
      
      if (isLoginMode) {
        btn.textContent = 'Masuk';
        switchText.textContent = 'Belum punya akun?';
        switchLink.textContent = 'Daftar di sini';
      } else {
        btn.textContent = 'Daftar';
        switchText.textContent = 'Sudah punya akun?';
        switchLink.textContent = 'Masuk di sini';
      }
      document.getElementById('message').className = 'message';
    }
    
    // ===== TAMPILKAN DASHBOARD =====
    function showDashboard(email) {
      document.getElementById('authForm').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      document.getElementById('userEmail').textContent = email;
    }
    
    // ===== TAMPILKAN PESAN =====
    function showMessage(text, type) {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.className = 'message ' + type;
    }
    
    // ===== JALANKAN SAAT HALAMAN LOAD =====
    checkSession();
  </script>
</body>
</html>
